<!DOCTYPE html>
<html>
<head>
    <title>Notion Minecraft Clone</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #gui { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.5); padding: 10px; pointer-events: none; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="gui">
        操作说明：<br>
        W/A/S/D - 移动 | 空格 - 跳跃<br>
        鼠标左键 - 放置方块 | 右键 - 挖掘<br>
        点击屏幕开始游戏
    </div>
    <!-- 引入简易3D引擎 Three.js -->
    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.132.2';
        import { PointerLockControls } from 'https://cdn.skypack.dev/three@0.132.2/examples/jsm/controls/PointerLockControls.js';

        // 基础场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // 天空蓝
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // 控制器
        const controls = new PointerLockControls(camera, document.body);
        document.addEventListener('click', () => controls.lock());

        // 地面网格
        const boxSize = 1;
        const boxGeo = new THREE.BoxGeometry(boxSize, boxSize, boxSize);
        const textureLoader = new THREE.TextureLoader();
        const material = new THREE.MeshLambertMaterial({ color: 0x4CAF50 }); // 草绿色

        for(let x = -10; x < 10; x++) {
            for(let z = -10; z < 10; z++) {
                const mesh = new THREE.Mesh(boxGeo, material);
                mesh.position.set(x, 0, z);
                scene.add(mesh);
            }
        }

        camera.position.y = 2;

        // 简易移动逻辑
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        const onKeyDown = (e) => {
            if (e.code === 'KeyW') moveForward = true;
            if (e.code === 'KeyS') moveBackward = true;
            if (e.code === 'KeyA') moveLeft = true;
            if (e.code === 'KeyD') moveRight = true;
        };
        const onKeyUp = (e) => {
            if (e.code === 'KeyW') moveForward = false;
            if (e.code === 'KeyS') moveBackward = false;
            if (e.code === 'KeyA') moveLeft = false;
            if (e.code === 'KeyD') moveRight = false;
        };
        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);

        // 渲染循环
        const velocity = new THREE.Vector3();
        function animate() {
            requestAnimationFrame(animate);
            if (controls.isLocked) {
                const delta = 0.1;
                velocity.set(0, 0, 0);
                if (moveForward) velocity.z -= delta;
                if (moveBackward) velocity.z += delta;
                if (moveLeft) velocity.x -= delta;
                if (moveRight) velocity.x += delta;
                controls.moveRight(velocity.x);
                controls.moveForward(-velocity.z);
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
